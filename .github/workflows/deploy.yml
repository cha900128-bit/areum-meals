
name: 아름고 급식 자동 갱신 및 웹사이트 게시

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 0,6,12,18 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 급식정보 갱신
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
        run: python scripts/build_meals.py

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: 웹사이트 파일 업로드
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 게시
        id: deployment
        uses: actions/deploy-pages@v4
